<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letewa Runner</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Letewa Runner</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Jobs</a>
            <a href="#">Profile</a>
        </nav>
    </header>
    <main>
        <section id="jobs-section">
            <h2>Available Jobs</h2>
            <ul id="jobs-list"></ul>
        </section>
        <section id="verification-section">
            <h2>Verification</h2>
            <form id="verification-form">
                <input type="file" accept="image/*" capture="camera" required>
                <button type="submit">Upload Proof</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Letewa. All rights reserved.</p>
    </footer>
    <script src="js/runner.js"></script>
</body>
</html>
